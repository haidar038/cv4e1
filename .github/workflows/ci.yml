name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (lint · types · boundaries · unit · build · budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Typecheck (strict)
        run: bun run typecheck
      - name: Module boundaries
        run: bun run check:boundaries
      - name: Unit tests
        run: bun run test:unit
      - name: Production build
        run: bun run build
      - name: Privacy check (NFR-006 secrets in dist, NFR-011 console allowlist)
        run: bun run check:privacy
      - name: Bundle budget (ratchet +10%, D24)
        run: bun run check:budget

  e2e:
    name: e2e (Chromium on Linux, per ADR-0007)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium with system dependencies
        run: bunx playwright install --with-deps chromium
      - name: Run e2e tests (Chromium only in CI)
        run: bunx playwright test --project=chromium
